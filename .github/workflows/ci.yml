name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6 # проверка gradle-wrapper.jar, без кэша Gradle

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: ./gradlew build # build включает test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/
          if-no-files-found: ignore